name: votesmart_india
description: "VoteSmart India — AI-powered Election Process Education Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.2

  # Firebase
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.12
  firebase_analytics: ^11.4.4
  cloud_functions: ^5.2.8

  # Utilities
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  intl: any
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.7
  shimmer: ^3.0.0
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
